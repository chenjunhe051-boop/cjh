# Ultralytics YOLO 🚀, AGPL-3.0 license
# DEYOLO with 3 backbones: RGB + IR + Depth
# YOLOv8 object detection model with P3-P5 outputs.

# Parameters
nc: 80  # number of classes
ch: 3
ch2: 3
ch3: 3
scale: m  # scale m balances capacity vs VRAM (3 backbones @ 1280)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# backbone (RGB, 3ch)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 3, C2f_BiFocus, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]        # 9

# backbone2 (IR, 3ch)
backbone2:
  - [-1, 1, Conv, [64, 3, 2]]       # 10-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 11-P2/4
  - [-1, 3, C2f_BiFocus, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]      # 13-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]      # 15-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]     # 17-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]        # 19

# backbone3 (Depth, 3ch)
backbone3:
  - [-1, 1, Conv, [64, 3, 2]]       # 20-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 21-P2/4
  - [-1, 3, C2f_BiFocus, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]      # 23-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]      # 25-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]     # 27-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]        # 29

# Head: DEA3 三模态融合 + PANet neck
head:
  - [[4, 14, 24], 1, DEA3, [256, 80]]     # 30  (P3: RGB+IR+Depth fusion)
  - [[6, 16, 26], 1, DEA3, [512, 40]]     # 31  (P4: RGB+IR+Depth fusion)
  - [[9, 19, 29], 1, DEA3, [1024, 20]]    # 32  (P5: RGB+IR+Depth fusion)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 31], 1, Concat, [1]]            # 34  (cat P5_up + P4_DEA3)
  - [-1, 3, C2f, [512]]                   # 35

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 30], 1, Concat, [1]]            # 37  (cat P4_up + P3_DEA3)
  - [-1, 3, C2f, [256]]                   # 38  (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 35], 1, Concat, [1]]            # 40  (cat P3_down + head P4)
  - [-1, 3, C2f, [512]]                   # 41  (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 32], 1, Concat, [1]]            # 43  (cat P4_down + P5_DEA3)
  - [-1, 3, C2f, [1024]]                  # 44  (P5/32-large)

  - [[38, 41, 44], 1, Detect, [nc]]       # 45  Detect(P3, P4, P5)
