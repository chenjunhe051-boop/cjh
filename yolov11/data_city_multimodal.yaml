# 面向城市场景的视觉多模态目标检测 - 三模态数据配置
# 目录结构(按你的服务器实际路径):
#   /root/autodl-tmp/mydata/images/vis_train  vis_val
#   /root/autodl-tmp/mydata/images/ir_train   ir_val
#   /root/autodl-tmp/mydata/images/depth_train depth_val
#   /root/autodl-tmp/mydata/labels/vis_train  vis_val   (标准YOLO格式 txt)

train: /root/autodl-tmp/mydata/images/vis_train
val: /root/autodl-tmp/mydata/images/vis_val
# test: /root/autodl-tmp/mydata/images/vis_test   # 官方开放测试集后填写

train_ir: /root/autodl-tmp/mydata/images/ir_train
val_ir: /root/autodl-tmp/mydata/images/ir_val
# test_ir: /root/autodl-tmp/mydata/images/ir_test

# Classes (12类)
names:
  0: person
  1: boat
  2: animal
  3: seat
  4: sign
  5: bicycle
  6: car
  7: ball
  8: light
  9: garbage can
  10: uav
  11: tricycle
