# Ultralytics YOLO11 - Tri-modal (RGB + Infrared + Depth) detection model  [scale: m]
# 结构同 s 版(52层), 仅缩放系数不同: width=1.0, max_channels=512
# 注意 max_channels=512 使 P5 每分支通道被截断为 512, 故 CIFusion3 参数为 [256, 512, 512]
#   from = -1 : 继续当前分支
#   from = -6 : RGB 分支   from = -5 : 红外分支   from = -4 : 深度分支
#   from = -3 : 三模态融合层 CIFusion3 (cat 三路特征 -> 融合 -> 均分回三路)
#   ADD3      : 三特征逐元素相加

# Parameters
nc: 12
scales:
  # [depth, width, max_channels]
  m: [0.50, 1.00, 512]

# YOLO11 tri-modal backbone
backbone:
  # [from, repeats, module, args]
  # ---------- RGB stream ----------
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  # ---------- IR stream ----------
  - [-5, 1, Conv, [64, 3, 2]]           # 4-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 5-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 6
  - [-1, 1, Conv, [256, 3, 2]]          # 7-P3/8
  # ---------- Depth stream ----------
  - [-4, 1, Conv, [64, 3, 2]]           # 8-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 9-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 10
  - [-1, 1, Conv, [256, 3, 2]]          # 11-P3/8
  # ---------- Fusion P3 ----------
  - [-3, 1, CIFusion3, [256]]           # 12  (scale m)

  # ---------- RGB P4 ----------
  - [-6, 2, C3k2, [512, False, 0.25]]   # 13
  - [-1, 1, Conv, [512, 3, 2]]          # 14-P4/16
  # ---------- IR P4 ----------
  - [-5, 2, C3k2, [512, False, 0.25]]   # 15
  - [-1, 1, Conv, [512, 3, 2]]          # 16-P4/16
  # ---------- Depth P4 ----------
  - [-4, 2, C3k2, [512, False, 0.25]]   # 17
  - [-1, 1, Conv, [512, 3, 2]]          # 18-P4/16
  # ---------- Fusion P4 ----------
  - [-3, 1, CIFusion3, [512]]           # 19  (scale m)

  # ---------- RGB P5 ----------
  - [-6, 2, C3k2, [512, True]]          # 20
  - [-1, 1, Conv, [1024, 3, 2]]         # 21-P5/32
  # ---------- IR P5 ----------
  - [-5, 2, C3k2, [512, True]]          # 22
  - [-1, 1, Conv, [1024, 3, 2]]         # 23-P5/32
  # ---------- Depth P5 ----------
  - [-4, 2, C3k2, [512, True]]          # 24
  - [-1, 1, Conv, [1024, 3, 2]]         # 25-P5/32
  # ---------- Fusion P5 ----------
  - [-3, 1, CIFusion3, [512]]           # 26  (scale m, P5被max_channels截断为512)

  # ---------- RGB top ----------
  - [-6, 2, C3k2, [1024, True]]         # 27
  - [-1, 1, SPPF, [1024, 5]]            # 28
  - [-1, 2, C2PSA, [1024]]              # 29
  # ---------- IR top ----------
  - [-5, 2, C3k2, [1024, True]]         # 30
  - [-1, 1, SPPF, [1024, 5]]            # 31
  - [-1, 2, C2PSA, [1024]]              # 32
  # ---------- Depth top ----------
  - [-4, 2, C3k2, [1024, True]]         # 33
  - [-1, 1, SPPF, [1024, 5]]            # 34
  - [-1, 2, C2PSA, [1024]]              # 35

  # ---------- per-scale summation ----------
  - [[13, 15, 17], 1, ADD3, [1]]        # 36  P3/8 fused
  - [[20, 22, 24], 1, ADD3, [1]]        # 37  P4/16 fused
  - [[29, 32, 35], 1, ADD3, [1]]        # 38  P5/32 fused

# YOLO11 head (PAN-FPN, 同原版)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 39
  - [[-1, 37], 1, Concat, [1]]                   # 40 cat P4
  - [-1, 2, C3k2, [512, False]]                  # 41

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 42
  - [[-1, 36], 1, Concat, [1]]                   # 43 cat P3
  - [-1, 2, C3k2, [256, False]]                  # 44 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                   # 45
  - [[-1, 41], 1, Concat, [1]]                   # 46
  - [-1, 2, C3k2, [512, False]]                  # 47 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                   # 48
  - [[-1, 38], 1, Concat, [1]]                   # 49
  - [-1, 2, C3k2, [1024, True]]                  # 50 (P5/32-large)

  - [[44, 47, 50], 1, Detect, [nc]]              # 51 Detect(P3, P4, P5)
