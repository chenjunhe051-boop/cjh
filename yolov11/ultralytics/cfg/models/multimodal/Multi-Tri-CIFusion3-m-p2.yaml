# Ultralytics YOLO11 - Tri-modal (RGB+IR+Depth)  [scale: m, P2小目标头]
# 59层: 在 m 版基础上新增 P2(stride4) 检测层, 检测头4级[P2,P3,P4,P5]
# 头部结构: P5->P4->P3->P2 上采样聚合, 再 P2->P3->P4->P5 三段下采样回传
nc: 12
scales:
  m: [0.50, 1.00, 512]

backbone:
  # ---------- RGB stream ----------
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2  P2/4
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  # ---------- IR stream ----------
  - [-5, 1, Conv, [64, 3, 2]]           # 4-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 5-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 6  P2/4
  - [-1, 1, Conv, [256, 3, 2]]          # 7-P3/8
  # ---------- Depth stream ----------
  - [-4, 1, Conv, [64, 3, 2]]           # 8-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 9-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 10 P2/4
  - [-1, 1, Conv, [256, 3, 2]]          # 11-P3/8
  - [-3, 1, CIFusion3, [256]]           # 12
  - [-6, 2, C3k2, [512, False, 0.25]]   # 13
  - [-1, 1, Conv, [512, 3, 2]]          # 14-P4/16
  - [-5, 2, C3k2, [512, False, 0.25]]   # 15
  - [-1, 1, Conv, [512, 3, 2]]          # 16-P4/16
  - [-4, 2, C3k2, [512, False, 0.25]]   # 17
  - [-1, 1, Conv, [512, 3, 2]]          # 18-P4/16
  - [-3, 1, CIFusion3, [512]]           # 19
  - [-6, 2, C3k2, [512, True]]          # 20
  - [-1, 1, Conv, [1024, 3, 2]]         # 21-P5/32
  - [-5, 2, C3k2, [512, True]]          # 22
  - [-1, 1, Conv, [1024, 3, 2]]         # 23-P5/32
  - [-4, 2, C3k2, [512, True]]          # 24
  - [-1, 1, Conv, [1024, 3, 2]]         # 25-P5/32
  - [-3, 1, CIFusion3, [512]]           # 26
  - [-6, 2, C3k2, [1024, True]]         # 27
  - [-1, 1, SPPF, [1024, 5]]            # 28
  - [-1, 2, C2PSA, [1024]]              # 29
  - [-5, 2, C3k2, [1024, True]]         # 30
  - [-1, 1, SPPF, [1024, 5]]            # 31
  - [-1, 2, C2PSA, [1024]]              # 32
  - [-4, 2, C3k2, [1024, True]]         # 33
  - [-1, 1, SPPF, [1024, 5]]            # 34
  - [-1, 2, C2PSA, [1024]]              # 35
  - [[2, 6, 10], 1, ADD3, [1]]          # 36  P2/4 fused (256)
  - [[13, 15, 17], 1, ADD3, [1]]        # 37  P3/8 fused (512)
  - [[20, 22, 24], 1, ADD3, [1]]        # 38  P4/16 fused (512)
  - [[29, 32, 35], 1, ADD3, [1]]        # 39  P5/32 fused (512)

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 40  512@/16
  - [[-1, 38], 1, Concat, [1]]                   # 41
  - [-1, 2, C3k2, [512, False]]                  # 42  P4/16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 43  512@/8
  - [[-1, 37], 1, Concat, [1]]                   # 44
  - [-1, 2, C3k2, [256, False]]                  # 45  P3/8
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 46  256@/4
  - [[-1, 36], 1, Concat, [1]]                   # 47
  - [-1, 2, C3k2, [256, False]]                  # 48  P2/4  ← 小目标检测层
  - [-1, 1, Conv, [256, 3, 2]]                   # 49  256@/8
  - [[-1, 45], 1, Concat, [1]]                   # 50
  - [-1, 2, C3k2, [256, False]]                  # 51  P3/8 (重算)
  - [-1, 1, Conv, [256, 3, 2]]                   # 52  256@/16
  - [[-1, 42], 1, Concat, [1]]                   # 53
  - [-1, 2, C3k2, [512, False]]                  # 54  P4/16 (重算)
  - [-1, 1, Conv, [512, 3, 2]]                   # 55  512@/32
  - [[-1, 39], 1, Concat, [1]]                   # 56
  - [-1, 2, C3k2, [1024, True]]                  # 57  P5/32
  - [[48, 51, 54, 57], 1, Detect, [nc]]          # 58  Detect(P2,P3,P4,P5)
