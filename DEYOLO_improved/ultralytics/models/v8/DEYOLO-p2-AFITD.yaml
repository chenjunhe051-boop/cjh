# DEYOLO-P2 + AFITDYOLO modules (MFFM + CAFM + MFEConv)
# 640 resolution, 12 classes for urban multi-modal detection

nc: 12
ch: 3
ch2: 6
scale: s
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f_BiFocus, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

backbone2:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f_BiFocus, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  # DEA fusion at P2, P3, P4, P5
  - [[1, 11], 1, DEA, [128, 160]]
  - [[4, 14], 1, DEA, [256, 80]]
  - [[6, 16], 1, DEA, [512, 40]]
  - [[9, 19], 1, DEA, [1024, 20]]

  # FPN: P5 -> P4 -> P3 -> P2
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 22], 1, MFFM, [512]]
  - [-1, 3, C2f_MFE, [512]]

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 21], 1, MFFM, [256]]
  - [-1, 3, C2f_MFE, [256]]

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 20], 1, MFFM, [128]]
  - [-1, 3, C2f_MFE, [128]]

  # PAN: P2 -> P3 -> P4 -> P5
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 29], 1, MFFM, [256]]
  - [-1, 3, C2f_MFE, [256]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 26], 1, MFFM, [512]]
  - [-1, 3, C2f_MFE, [512]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 23], 1, MFFM, [1024]]
  - [-1, 3, C2f_MFE, [1024]]

  # CAFM before detection heads
  - [32, 1, CAFM, [128]]
  - [35, 1, CAFM, [256]]
  - [38, 1, CAFM, [512]]
  - [41, 1, CAFM, [1024]]

  - [[42, 43, 44, 45], 1, Detect, [nc]]