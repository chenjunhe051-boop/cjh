# DEYOLO with P2 detection head for small objects (ball, sign, uav, light)
# P2 stride=4 → 160×160 feature map at 640, 320×320 at 1280

nc: 80
ch: 3
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 3, C2f_BiFocus, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]        # 9

backbone2:
  - [-1, 1, Conv, [64, 3, 2]]       # 10-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 11-P2/4
  - [-1, 3, C2f_BiFocus, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]      # 13-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]      # 15-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]     # 17-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]        # 19

head:
  # DEA fusion at P2, P3, P4, P5
  - [[1, 11], 1, DEA, [128, 160]]   # 20  P2
  - [[4, 14], 1, DEA, [256, 80]]    # 21  P3
  - [[6, 16], 1, DEA, [512, 40]]    # 22  P4
  - [[9, 19], 1, DEA, [1024, 20]]   # 23  P5

  # FPN: P5 → P4 → P3 → P2
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 24
  - [[-1, 22], 1, Concat, [1]]                    # 25
  - [-1, 3, C2f, [512]]                           # 26

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 27
  - [[-1, 21], 1, Concat, [1]]                    # 28
  - [-1, 3, C2f, [256]]                           # 29

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 30
  - [[-1, 20], 1, Concat, [1]]                    # 31
  - [-1, 3, C2f, [128]]                           # 32 (P2)

  # PAN: P2 → P3 → P4 → P5
  - [-1, 1, Conv, [128, 3, 2]]                    # 33
  - [[-1, 29], 1, Concat, [1]]                    # 34
  - [-1, 3, C2f, [256]]                           # 35

  - [-1, 1, Conv, [256, 3, 2]]                    # 36
  - [[-1, 26], 1, Concat, [1]]                    # 37
  - [-1, 3, C2f, [512]]                           # 38

  - [-1, 1, Conv, [512, 3, 2]]                    # 39
  - [[-1, 23], 1, Concat, [1]]                    # 40
  - [-1, 3, C2f, [1024]]                          # 41

  - [[32, 35, 38, 41], 1, Detect, [nc]]           # P2, P3, P4, P5
